# Необязательный фрагмент пользовательского config.toml Codex.
# Объединяйте с существующими таблицами, не создавайте их дубликаты.
# Включается пользователем; не даёт разрешения изменять аватар.

[features]
memories = true

[memories]
generate_memories = true
use_memories = true
# false позволяет учитывать подходящие чаты с MCP/поиском как вход памяти.
# Это не гарантирует запоминание каждой детали или немедленное обновление.
disable_on_external_context = false

[history]
persistence = "save-all"

# История и память клиента отделены от файлов конкретного Unity-проекта.
# Для обязательных правил используйте AGENTS.md; для фактов — журналы проекта.
