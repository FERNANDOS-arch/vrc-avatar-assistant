# VRC Avatar Assistant v1.1-alpha — пример, не активный конфиг.
# Применяется пользователем к целевой сессии/пользовательскому config.toml.
# Проектный .codex/config.toml — только по отдельному выбору пользователя.
# Объединяйте с существующим конфигом, не создавайте дубли таблиц/серверов.
# Корневые ключи до таблиц. Не сочетайте sandbox_mode с default_permissions.

sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "user"
web_search = "live"

# Используйте реальное имя уже подключённого сервера в обеих таблицах.
# Для неперечисленных инструментов остаётся prompt; доступен только execute_csharp.
[mcp_servers.unity_vrc]
url = "http://127.0.0.1:14523/mcp/"
enabled_tools = ["execute_csharp"]
default_tools_approval_mode = "prompt"

# Явное предварительное разрешение единственного Unity-инструмента.
# Не выдавайте auto за гарантию отсутствия запросов; пример per-tool approve
# приведён в официальной документации MCP. Применение проверить в клиенте.
[mcp_servers.unity_vrc.tools.execute_csharp]
approval_mode = "approve"

# Самостоятельность разрешена в пределах TASK_SCOPE, а не произвольной целью.
# execute_csharp универсален: этот параметр не ограничивает код одним аватаром.
# Sandbox Codex не ограничивает отдельно работающий Unity-процесс.
# Системные/серверные и managed-ограничения могут сохраняться; отказ не обходить.
# Не включайте полный доступ ради устранения блокировки.
# Проверка подключения и поведения: ACCEPTANCE_TESTS_RU.md.
